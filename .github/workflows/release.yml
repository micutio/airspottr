name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - img: ubuntu-latest
            os: linux
            arch: amd64
            ext: ""
          - img: ubuntu-latest
            os: linux
            arch: arm64
            ext: ""
          - img: macos-latest
            os: darwin
            arch: amd64
            ext: ""
          - img: macos-latest
            os: darwin
            arch: arm64
            ext: ""
          - img: windows-latest
            os: windows
            arch: amd64
            ext: ".exe"
          - img: windows-latest
            os: windows
            arch: arm64
            ext: ".exe"
    runs-on: $ {{ matrix.img }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go test ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - img: ubuntu-latest
            os: linux
            arch: amd64
            ext: ""
          - img: ubuntu-latest
            os: linux
            arch: arm64
            ext: ""
          - img: macos-latest
            os: darwin
            arch: amd64
            ext: ""
          - img: macos-latest
            os: darwin
            arch: arm64
            ext: ""
          - img: windows-latest
            os: windows
            arch: amd64
            ext: ".exe"
          - img: windows-latest
            os: windows
            arch: arm64
            ext: ".exe"
    runs-on: $ {{ matrix.img }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          ext="${{ matrix.ext }}"
          go build -ldflags="-s -w" -o "airspottr-${{ matrix.os }}-${{ matrix.arch }}${ext}" .
      - uses: actions/upload-artifact@v4
        with:
          name: airspottr-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
          path: airspottr-*

  release:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - img: ubuntu-latest
            os: linux
            arch: amd64
            ext: ""
          - img: ubuntu-latest
            os: linux
            arch: arm64
            ext: ""
          - img: macos-latest
            os: darwin
            arch: amd64
            ext: ""
          - img: macos-latest
            os: darwin
            arch: arm64
            ext: ""
          - img: windows-latest
            os: windows
            arch: amd64
            ext: ".exe"
          - img: windows-latest
            os: windows
            arch: arm64
            ext: ".exe"
    runs-on: $ {{ matrix.img }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
